name: Build Codex for Intel macOS

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Codex x86_64 macOS
    runs-on: macos-15-intel

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Clone OpenAI Codex
        run: |
          set -euo pipefail

          git clone --depth 1 --branch rust-v0.154.0 \
            https://github.com/openai/codex.git \
            codex-source

      - name: Install Rust 1.95.0
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy, rust-src

      - name: Show environment
        run: |
          set -euo pipefail

          echo "=== System ==="
          sw_vers

          echo
          echo "=== Architecture ==="
          uname -m

          echo
          echo "=== Rust ==="
          rustc --version
          cargo --version

          echo
          echo "=== CPU ==="
          sysctl -n hw.ncpu

          echo
          echo "=== Memory ==="
          sysctl -n hw.memsize

      - name: Patch Bedrock namespace tools
        working-directory: codex-source
        shell: bash
        run: |
          set -euo pipefail

          FILE="codex-rs/model-provider/src/provider.rs"

          if [ ! -f "$FILE" ]; then
            echo "ERROR: File not found: $FILE"
            exit 1
          fi

          echo "=== Before patch ==="
          sed -n '316,335p' "$FILE"

          python3 - "$FILE" <<'PY'
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          text = path.read_text()

          old = """        ProviderCapabilities {
            remote_compaction,
            ..ProviderCapabilities::default()
        }"""

          new = """        ProviderCapabilities {
            namespace_tools: false,
            remote_compaction,
            ..ProviderCapabilities::default()
        }"""

          if old not in text:
              print("ERROR: Target ProviderCapabilities block not found.")
              print()
              print("Actual source around ConfiguredModelProvider:")
              start = text.find(
                  "impl ModelProvider for ConfiguredModelProvider"
              )
              if start == -1:
                  raise SystemExit(
                      "ERROR: ConfiguredModelProvider not found."
                  )

              print(text[start:start + 1200])
              sys.exit(1)

          text = text.replace(old, new, 1)
          path.write_text(text)

          print()
          print("SUCCESS: namespace_tools = false")
          PY

          echo
          echo "=== After patch ==="
          sed -n '316,337p' "$FILE"

      - name: Verify Bedrock patch
        working-directory: codex-source
        shell: bash
        run: |
          set -euo pipefail

          FILE="codex-rs/model-provider/src/provider.rs"

          python3 - "$FILE" <<'PY'
          from pathlib import Path
          import sys

          text = Path(sys.argv[1]).read_text()

          provider_start = text.find(
              "impl ModelProvider for ConfiguredModelProvider"
          )

          if provider_start == -1:
              raise SystemExit(
                  "ERROR: ConfiguredModelProvider not found."
              )

          capabilities_start = text.find(
              "fn capabilities(&self) -> ProviderCapabilities",
              provider_start,
          )

          if capabilities_start == -1:
              raise SystemExit(
                  "ERROR: capabilities() not found."
              )

          next_fn = text.find(
              "fn approval_review_preferred_model",
              capabilities_start,
          )

          if next_fn == -1:
              raise SystemExit(
                  "ERROR: End of capabilities() not found."
              )

          block = text[capabilities_start:next_fn]

          if "namespace_tools: false" not in block:
              print(block)
              raise SystemExit(
                  "ERROR: namespace_tools was not patched."
              )

          print("SUCCESS: Bedrock namespace patch verified.")
          PY

      - name: Build Codex
        working-directory: codex-source/codex-rs
        env:
          CARGO_TERM_COLOR: always
        run: |
          set -euo pipefail

          cargo +1.95.0 build -p codex-cli --bin codex

      - name: Verify Codex binary
        working-directory: codex-source/codex-rs
        shell: bash
        run: |
          set -euo pipefail

          echo "=== File type ==="
          file target/debug/codex

          echo
          echo "=== Architecture ==="
          lipo -info target/debug/codex || true

          echo
          echo "=== Codex version ==="
          ./target/debug/codex --version

      - name: Package Codex
        working-directory: codex-source/codex-rs
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p ../../codex-artifact

          cp target/debug/codex \
            ../../codex-artifact/codex

          chmod +x \
            ../../codex-artifact/codex

          cat > ../../codex-artifact/README.txt <<'EOF'
          Custom Codex build for Intel macOS.

          Source:
          OpenAI Codex rust-v0.154.0

          Rust:
          1.95.0

          Bedrock Mantle compatibility:
          namespace_tools = false

          Target:
          macOS Intel x86_64

          Model is configured separately in config.toml.
          EOF

      - name: Upload Codex artifact
        uses: actions/upload-artifact@v4
        with:
          name: codex-intel-macos
          path: codex-artifact/
          if-no-files-found: error
          retention-days: 7
