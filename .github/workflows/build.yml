name: Build Codex for Intel macOS

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Codex x86_64 macOS
    runs-on: macos-15-intel

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Clone OpenAI Codex
        run: |
          set -euo pipefail

          git clone --depth 1 --branch rust-v0.154.0 \
            https://github.com/openai/codex.git \
            codex-source

      - name: Install Rust 1.95.0
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy, rust-src

      - name: Show environment
        run: |
          set -euo pipefail

          echo "=== System ==="
          sw_vers

          echo
          echo "=== Architecture ==="
          uname -m

          echo
          echo "=== Rust ==="
          rustc --version
          cargo --version

          echo
          echo "=== CPU ==="
          sysctl -n hw.ncpu

      - name: Patch ConfiguredModelProvider
        working-directory: codex-source
        shell: bash
        run: |
          set -euo pipefail

          FILE="codex-rs/model-provider/src/provider.rs"

          if [ ! -f "$FILE" ]; then
            echo "ERROR: File not found: $FILE"
            exit 1
          fi

          python3 - "$FILE" <<'PY'
          from pathlib import Path
          import re
          import sys

          path = Path(sys.argv[1])
          text = path.read_text()

          impl_start = text.find(
              "impl ModelProvider for ConfiguredModelProvider"
          )

          if impl_start == -1:
              raise SystemExit(
                  "ERROR: ConfiguredModelProvider implementation not found."
              )

          cap_start = text.find(
              "fn capabilities(&self) -> ProviderCapabilities",
              impl_start,
          )

          if cap_start == -1:
              raise SystemExit(
                  "ERROR: ConfiguredModelProvider capabilities() not found."
              )

          next_fn = text.find(
              "fn approval_review_preferred_model",
              cap_start,
          )

          if next_fn == -1:
              raise SystemExit(
                  "ERROR: Could not locate end of capabilities()."
              )

          block = text[cap_start:next_fn]

          pattern = (
              r"ProviderCapabilities\s*\{\s*"
              r"remote_compaction,\s*"
              r"\.\.ProviderCapabilities::default\(\),\s*"
              r"\}"
          )

          replacement = """ProviderCapabilities {
              namespace_tools: false,
              image_generation: false,
              web_search: false,
              external_web_access: false,
              remote_compaction,
          }"""

          new_block, count = re.subn(
              pattern,
              replacement,
              block,
              count=1,
          )

          if count != 1:
              print("ERROR: Could not patch capabilities().")
              print("=== Current capabilities() ===")
              print(block)
              sys.exit(1)

          text = text[:cap_start] + new_block + text[next_fn:]
          path.write_text(text)

          print("SUCCESS: ConfiguredModelProvider patched.")
          PY

          echo
          echo "=== Patched capabilities() ==="

          sed -n \
            '/impl ModelProvider for ConfiguredModelProvider/,/fn approval_review_preferred_model/p' \
            "$FILE"

      - name: Verify patch
        working-directory: codex-source
        shell: bash
        run: |
          set -euo pipefail

          FILE="codex-rs/model-provider/src/provider.rs"

          python3 - "$FILE" <<'PY'
          from pathlib import Path
          import sys

          text = Path(sys.argv[1]).read_text()

          impl_start = text.find(
              "impl ModelProvider for ConfiguredModelProvider"
          )

          if impl_start == -1:
              raise SystemExit(
                  "ERROR: ConfiguredModelProvider not found."
              )

          cap_start = text.find(
              "fn capabilities(&self) -> ProviderCapabilities",
              impl_start,
          )

          next_fn = text.find(
              "fn approval_review_preferred_model",
              cap_start,
          )

          block = text[cap_start:next_fn]

          required = [
              "namespace_tools: false",
              "image_generation: false",
              "web_search: false",
              "external_web_access: false",
          ]

          for item in required:
              if item not in block:
                  raise SystemExit(
                      f"ERROR: Missing: {item}"
                  )

          print("SUCCESS: All capabilities verified.")
          PY

      - name: Build Codex
        working-directory: codex-source/codex-rs
        env:
          CARGO_TERM_COLOR: always
        run: |
          set -euo pipefail

          cargo +1.95.0 build -p codex-cli --bin codex

      - name: Verify Codex binary
        working-directory: codex-source/codex-rs
        shell: bash
        run: |
          set -euo pipefail

          echo "=== File type ==="
          file target/debug/codex

          echo
          echo "=== Architecture ==="
          lipo -info target/debug/codex || true

          echo
          echo "=== Codex version ==="
          ./target/debug/codex --version

      - name: Package Codex
        working-directory: codex-source/codex-rs
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p ../../codex-artifact

          cp target/debug/codex \
            ../../codex-artifact/codex

          chmod +x \
            ../../codex-artifact/codex

          cat > ../../codex-artifact/README.txt <<'EOF'
          Custom Codex build for Intel macOS.

          Source:
          OpenAI Codex rust-v0.154.0

          Rust:
          1.95.0

          AWS Bedrock Mantle compatibility:
          namespace_tools = false
          image_generation = false
          web_search = false
          external_web_access = false

          Target:
          macOS Intel x86_64
          EOF

      - name: Upload Codex artifact
        uses: actions/upload-artifact@v4
        with:
          name: codex-intel-macos
          path: codex-artifact/
          if-no-files-found: error
          retention-days: 7
