      - name: Patch Bedrock namespace tools
        working-directory: codex-source
        shell: bash
        run: |
          set -euo pipefail

          FILE="codex-rs/model-provider/src/provider.rs"

          python3 - "$FILE" <<'PY'
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          text = path.read_text()

          old = """        ProviderCapabilities {
            remote_compaction,
            ..ProviderCapabilities::default()
        }"""

          new = """        ProviderCapabilities {
            namespace_tools: false,
            image_generation: false,
            web_search: false,
            external_web_access: false,
            remote_compaction,
        }"""

          if old not in text:
              raise SystemExit(
                  "ERROR: Could not find ConfiguredModelProvider capabilities block."
              )

          text = text.replace(old, new, 1)

          path.write_text(text)

          print("SUCCESS: ConfiguredModelProvider namespace_tools disabled.")
          PY

          echo
          echo "=== Patched ConfiguredModelProvider ==="

          grep -n -A10 -B3 \
            "fn capabilities(&self) -> ProviderCapabilities" \
            "$FILE"
